{% extends 'base.html' %}

{% block title %}RailAssist - Admin Login{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-card-header">
            <h3>Admin & Official Login</h3>
            <p>Access the Complaint Monitoring Dashboard</p>
        </div>
        
        {% if error %}
        <div class="login-error-alert">
            <span class="error-icon">⚠️</span>
            <span class="error-text">{{ error }}</span>
        </div>
        {% endif %}
        
        <form action="{{ url_for('main.login') }}" method="POST" class="login-form">
            <div class="form-group-login">
                <label for="username">User ID / Username</label>
                <input type="text" id="username" name="username" placeholder="Enter Admin Username" required autofocus>
            </div>
            
            <div class="form-group-login">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter Admin Password" required>
            </div>
            
            <button type="submit" class="btn-submit login-btn">Login</button>
        </form>
    </div>
</div>
{% endblock %}
